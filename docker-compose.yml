version: "3.8"

services:
  # -------------------------------------------------------
  # SERVICIO 1: HOP SERVER (El que ya tenías)
  # -------------------------------------------------------
  hop-server:
    image: apache/hop:latest
    container_name: joli_hop_server
    hostname: hop-server
    ports:
      - "5678:8080"
    environment:
      - HOP_SERVER_USER=cluster
      - HOP_SERVER_PASSWORD=cluster
      - HOP_PROJECT=JoliDataHub
      # Ruta interna clave:
      - HOP_PROJECT_FOLDER=/files/project
      - HOP_OPTIONS=-Xmx2048m
    command: >
      /bin/bash -c "
      /opt/hop/hop-conf.sh -pd -p JoliDataHub || true; 
      /opt/hop/hop-conf.sh -pc -p JoliDataHub -ph /files/project; 
      /opt/hop/hop-server.sh -w 8080
      "
    volumes:
      # Mapeo físico en el VPS
      - ./project:/files/project
      - ./drivers:/opt/hop/lib/jdbc
    restart: unless-stopped

  # -------------------------------------------------------
  # SERVICIO 2: HOP WEB (Nuevo - Editor Visual)
  # -------------------------------------------------------
  hop-web:
    image: apache/hop-web:latest
    container_name: hop-web-pro
    # Usamos root para asegurar que pueda editar los archivos
    user: root
    expose:
      - "8080"
    environment:
      - HOP_OPTIONS=-Xmx2g
      - HOP_PROJECT_NAME=JoliDataHub
      # AJUSTE CRÍTICO: Ahora coincide con el server
      - HOP_PROJECT_FOLDER=/files/project
    volumes:
      # AJUSTE CRÍTICO: Mapeamos a la misma ruta profunda que el server
      - ./project:/files/project
      # Compartimos drivers también por si quieres probar conexiones en la web
      - ./drivers:/opt/hop/lib/jdbc
    restart: unless-stopped

  # -------------------------------------------------------
  # SERVICIO 3: NGINX (Seguridad para la Web)
  # -------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      # Puerto de entrada seguro
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - hop-web
    restart: unless-stopped