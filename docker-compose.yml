version: "3.8"

services:
  # -------------------------------------------------------
  # SERVICIO 1: HOP SERVER (AHORA SEGURO)
  # -------------------------------------------------------
  hop-server:
    image: apache/hop:latest
    container_name: joli_hop_server
    hostname: hop-server
    ports:
      - "5678:8080"
    environment:
      # NOTA: Borré las variables de USER/PASS porque ahora mandan las del XML
      - HOP_PROJECT=JoliDataHub
      - HOP_PROJECT_FOLDER=/files/project
      - HOP_OPTIONS=-Xmx2048m
    
    # COMANDO ACTUALIZADO:
    # 1. Configura el proyecto.
    # 2. Inicia el servidor LEYENDO el archivo de configuración XML (/files/config.xml)
    command: >
      /bin/bash -c "
      /opt/hop/hop-conf.sh -pd -p JoliDataHub || true; 
      /opt/hop/hop-conf.sh -pc -p JoliDataHub -ph /files/project; 
      /opt/hop/hop-server.sh /files/config.xml
      "
      
    volumes:
      # Mapeo físico en el VPS
      - ./project:/files/project
      - ./drivers:/opt/hop/lib/jdbc
      # CAMBIO CLAVE: Inyectamos el archivo XML de seguridad creado previamente
      - ./hop-server-config.xml:/files/config.xml
    restart: unless-stopped

  # -------------------------------------------------------
  # SERVICIO 2: HOP WEB (Editor Visual)
  # -------------------------------------------------------
  hop-web:
    image: apache/hop-web:latest
    container_name: hop-web-pro
    # Usamos root para asegurar que pueda editar los archivos
    user: root
    expose:
      - "8080"
    environment:
      - HOP_OPTIONS=-Xmx2g
      - HOP_PROJECT_NAME=JoliDataHub
      # Coincide con el server
      - HOP_PROJECT_FOLDER=/files/project
    volumes:
      # Mapeamos a la misma ruta profunda que el server
      - ./project:/files/project
      # Compartimos drivers
      - ./drivers:/opt/hop/lib/jdbc
    restart: unless-stopped

  # -------------------------------------------------------
  # SERVICIO 3: NGINX (Seguridad para la Web)
  # -------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      # Puerto de entrada seguro
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - hop-web
    restart: unless-stopped